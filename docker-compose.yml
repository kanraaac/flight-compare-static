services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        set -e
        apk add --no-cache curl >/dev/null
        mkdir -p /usr/share/nginx/html /etc/nginx/conf.d
        BASE=https://raw.githubusercontent.com/kanraaac/flight-compare-static/main/html
        curl -fsSL "$BASE/index.html" -o /usr/share/nginx/html/index.html
        curl -fsSL "$BASE/app.js" -o /usr/share/nginx/html/app.js
        curl -fsSL "$BASE/styles.css" -o /usr/share/nginx/html/styles.css
        cat > /etc/nginx/conf.d/default.conf <<'NGINX'
        server {
          listen 80;
          server_name flight.srv1821288.hstgr.cloud;
          root /usr/share/nginx/html;
          index index.html;
          location / { try_files $uri $uri/ /index.html; }
        }
        NGINX
        exec nginx -g 'daemon off;'
    labels:
      - traefik.enable=true
      - traefik.http.routers.flight-compare.rule=Host(`flight.srv1821288.hstgr.cloud`)
      - traefik.http.routers.flight-compare.entrypoints=websecure
      - traefik.http.routers.flight-compare.tls.certresolver=letsencrypt
      - traefik.http.services.flight-compare.loadbalancer.server.port=80
